<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Samvaad camera access</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:480px;margin:48px auto;padding:0 16px}button{font:inherit;padding:10px 16px;border-radius:8px;border:0;background:#1565c0;color:#fff;cursor:pointer}#out{margin-top:16px}</style></head>
<body><h1>Allow camera for Samvaad</h1>
<p>Samvaad reads your camera only after you press Start recognition, and sends frames only to the recognition service on this computer. Click below, then choose <b>Allow</b> in Chrome's prompt. This page releases the camera immediately.</p>
<button id="go" type="button">Allow camera</button><p id="out" role="status"></p>
<script src="permissions.js"></script></body></html>
